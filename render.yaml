services:
  - type: web
    name: enterprise-python-suite
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SECRET_KEY
        generateValue: true
